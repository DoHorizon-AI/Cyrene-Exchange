schema_version: cyrene.repository-policy.v1
repository:
  logical_name: Cyrene-Exchange
  lifecycle_class: PUBLIC_PRODUCT
  visibility: public
  source_owner: Cyrene Gateway Team
  remote_default_branch: develop
  integration_branch: develop
  release_branch: release
  default_branch: develop
ownership:
  owns:
  - API gateway, model request routing & load balancing
  - Quota management, rate limiting & upstream endpoint registry
  does_not_own:
  - Underlying model inference execution
  - Node hardware resource management
  - Prompt-cache storage, eviction, or maintenance implementation
  - Usage aggregation or cost-calculation implementation
  - Model training, custom-script execution, or generic worker lifecycle
build:
  independent: true
  build_systems:
  - pyproject
artifacts:
  package_units:
  - cyrene-exchange
  native_binaries: []
distribution:
  role: COMPONENT_RELEASE
  profiles:
  - gateway
  - full
  standalone_user_product: true
integration:
  multi_repo_required: true
authorities:
  ci: github
  release: ghcr
  deployment: dohorizon_azure
trust:
  public_requires_private: false
versioning:
  scheme: semver
  scope: repository
  tag_strategy: repository
  tag_pattern: v{version}
  automated_release: false
