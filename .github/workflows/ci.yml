name: ci

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exchange-core:
    name: ci / exchange-core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install exact locked dependencies
        run: uv sync --frozen --extra dev
      - name: Lint and test the direct Plugin consumer
        run: |
          uv run --no-sync ruff check --no-cache src tests
          uv run --no-sync ruff format --check --no-cache src tests
          uv run --no-sync pytest -p no:cacheprovider -q tests
      - name: Enforce standalone Plugin boundaries
        run: |
          test ! -d vendor/plugins-sdk
          test ! -d components/coordinator
          test ! -e proto/ai_service.proto
          private_token_name="CYRENE_CROSS_REPO""_TOKEN"
          private_repository_pattern='repository: DoHorizon-AI/Cyrene-'"(Platform|Plugins-Official)"
          if rg -n -e "$private_token_name" -e "$private_repository_pattern" .github/workflows; then
            echo 'Automatic source CI must not require private sibling repositories.' >&2
            exit 1
          fi

  publish-artifact:
    name: ci / immutable-artifact
    if: github.event_name != 'pull_request'
    needs: [exchange-core]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install locked packaging tool
        run: python -m pip install --disable-pip-version-check uv==0.12.3
      - name: Build immutable release bundle
        env:
          ARTIFACT_NAME: cyrene-exchange-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="Cyrene-Exchange-${GITHUB_SHA}/" "${GITHUB_SHA}" \
            > "dist/cyrene-exchange-${GITHUB_SHA}.source.tar.gz"
          uv build --wheel --out-dir dist .
          uv build --wheel --out-dir dist product
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          payload = []
          for path in sorted(dist.iterdir()):
              if path.name == "artifact-manifest.json":
                  continue
              payload.append(
                  {
                      "file": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "kind": "release-payload",
                  }
              )
          if not payload:
              raise SystemExit("artifact payload is empty")
          manifest = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "payload": payload,
          }
          (dist / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cyrene-exchange-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
