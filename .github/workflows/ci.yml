name: ci

on:
  push:
    branches: [develop, main, release, 'feat/**', 'fix/**']
  pull_request:
    branches: [develop, main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exchange-core:
    name: ci / exchange-core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install exact locked dependencies
        run: uv sync --frozen --extra dev
      - name: Lint and test the direct Plugin consumer
        run: |
          uv run --no-sync ruff check --no-cache src tests
          uv run --no-sync ruff format --check --no-cache src tests
          uv run --no-sync pytest -p no:cacheprovider -q tests
      - name: Enforce standalone Plugin boundaries
        run: |
          test ! -d vendor/plugins-sdk
          test ! -d components/coordinator
          test ! -e proto/ai_service.proto
          private_token_name="CYRENE_CROSS_REPO""_TOKEN"
          private_repository_pattern='repository: DoHorizon-AI/Cyrene-'"(Platform|Plugins-Official)"
          if rg -n -e "$private_token_name" -e "$private_repository_pattern" .github/workflows; then
            echo 'Automatic source CI must not require private sibling repositories.' >&2
            exit 1
          fi

  exchange-cross-repository:
    name: ci / exchange-cross-repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned to the revisions recorded in Cyrene-Workspace/release-lock.json.
      # Bump both together with that lock, never independently.
      CYRENE_PLATFORM_REVISION: 06a9bd75edfed1359b09770e749520162d75e242
      CYRENE_PLUGINS_REVISION: 0783ea5e5b722683ed0b75cd6d303039bb5f0241
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch the pinned sibling checkouts
        run: |
          for entry in "Cyrene-Platform:$CYRENE_PLATFORM_REVISION" "Cyrene-Plugins-Official:$CYRENE_PLUGINS_REVISION"; do
            name="${entry%%:*}"
            revision="${entry#*:}"
            git init --quiet "$RUNNER_TEMP/$name"
            git -C "$RUNNER_TEMP/$name" remote add origin "https://github.com/DoHorizon-AI/$name.git"
            # Fetch the pinned commit directly: it is a branch tip, so the
            # server can serve it, and a wrong pin fails here with the ref name
            # rather than half-way through the test run.
            git -C "$RUNNER_TEMP/$name" fetch --quiet --depth 1 origin "$revision"
            git -C "$RUNNER_TEMP/$name" checkout --quiet --detach FETCH_HEAD
          done
      - name: Install exact locked dependencies
        run: uv sync --frozen --extra dev
      - name: Run the cross-repository acceptance lane
        env:
          CYRENE_PLATFORM_WORKTREE: ${{ runner.temp }}/Cyrene-Platform
          CYRENE_PLUGINS_WORKTREE: ${{ runner.temp }}/Cyrene-Plugins-Official
        run: uv run --no-sync pytest -p no:cacheprovider -q tests/test_platform_integration.py

  publish-artifact:
    name: ci / immutable-artifact
    if: github.event_name != 'pull_request'
    needs: [exchange-core]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install locked packaging tool
        run: python -m pip install --disable-pip-version-check uv==0.12.3
      - name: Build immutable release bundle
        env:
          ARTIFACT_NAME: cyrene-exchange-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="Cyrene-Exchange-${GITHUB_SHA}/" "${GITHUB_SHA}" \
            > "dist/cyrene-exchange-${GITHUB_SHA}.source.tar.gz"
          uv build --wheel --out-dir dist .
          uv build --wheel --out-dir dist product
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          payload = []
          for path in sorted(dist.iterdir()):
              if path.name == "artifact-manifest.json":
                  continue
              payload.append(
                  {
                      "file": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "kind": "release-payload",
                  }
              )
          if not payload:
              raise SystemExit("artifact payload is empty")
          manifest = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "payload": payload,
          }
          (dist / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cyrene-exchange-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
