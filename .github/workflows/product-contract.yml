name: Product contract and MVP

on:
  pull_request:
    branches: [develop, main, release]
  push:
    branches: [develop, main, release, 'feat/**', 'fix/**']

permissions:
  contents: read

jobs:
  publish-owner-contract:
    name: owner / signed Product contract
    if: github.event_name == 'push' && contains(fromJSON('["refs/heads/develop","refs/heads/main","refs/heads/release"]'), github.ref)
    needs: [product-contract]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_COMMIT: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out the exact owner source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight immutable owner release support and tag namespace
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_READ_TOKEN: ${{ secrets.CYRENE_IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$IMMUTABLE_RELEASES_READ_TOKEN" ]]; then
            echo "CYRENE_IMMUTABLE_RELEASES_READ_TOKEN is required for read-only immutable-release preflight" >&2
            exit 2
          fi
          setting="$(GH_TOKEN="$IMMUTABLE_RELEASES_READ_TOKEN" gh api "repos/$SOURCE_REPOSITORY/immutable-releases")"
          if [[ "$(jq -r '.enabled' <<<"$setting")" != true ]]; then
            echo "immutable releases are not enabled for $SOURCE_REPOSITORY; refusing publication" >&2
            exit 2
          fi
          case "$SOURCE_REF" in
            refs/heads/develop) release_channel=preview ;;
            refs/heads/main|refs/heads/release) release_channel=stable ;;
            *) echo "unapproved Product source ref: $SOURCE_REF" >&2; exit 2 ;;
          esac
          release_tag="product-contract-v2-${release_channel}-${SOURCE_COMMIT}"
          for ref_path in "repos/$SOURCE_REPOSITORY/git/ref/tags/$release_tag" "repos/$SOURCE_REPOSITORY/releases/tags/$release_tag"; do
            error_file="$RUNNER_TEMP/github-api-error.txt"
            if gh api "$ref_path" >/dev/null 2>"$error_file"; then
              echo "owner release tag or release already exists: $release_tag" >&2
              exit 2
            fi
            if ! grep -q 'HTTP 404' "$error_file"; then
              cat "$error_file" >&2
              echo "could not prove owner release namespace is unused" >&2
              exit 2
            fi
          done
          echo "RELEASE_CHANNEL=$release_channel" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - name: Prepare the exact committed Product catalog
        env:
          PUBLICATION_ROOT: ${{ runner.temp }}/product-contract-publication
        run: >-
          python tools/release/product_contract_release.py prepare
          --root "$GITHUB_WORKSPACE"
          --repository "$SOURCE_REPOSITORY"
          --ref "$SOURCE_REF"
          --commit "$SOURCE_COMMIT"
          --output-dir "$PUBLICATION_ROOT"
      - name: Attest the owner catalog bytes
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/product-contract-publication/contracts/product/v2/catalog.json
          github-token: ${{ github.token }}
      - name: Download the detached owner attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ROOT: ${{ runner.temp }}/product-contract-publication
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/product-contract-attestations"
          mkdir -p "$download_dir"
          (
            cd "$download_dir"
            gh attestation download \
              "$PUBLICATION_ROOT/contracts/product/v2/catalog.json" \
              --repo "$SOURCE_REPOSITORY"
          )
          mapfile -t bundles < <(find "$download_dir" -maxdepth 1 -type f -name '*.jsonl' -print)
          if [[ "${#bundles[@]}" -ne 1 ]]; then
            echo "expected one detached attestation bundle, found ${#bundles[@]}" >&2
            exit 2
          fi
          gh attestation verify \
            "$PUBLICATION_ROOT/contracts/product/v2/catalog.json" \
            --repo "$SOURCE_REPOSITORY" \
            --bundle "${bundles[0]}" \
            --cert-identity "https://github.com/$SOURCE_REPOSITORY/.github/workflows/product-contract.yml@$SOURCE_REF" \
            --source-digest "$SOURCE_COMMIT" \
            --source-ref "$SOURCE_REF" \
            --deny-self-hosted-runners
          python tools/release/product_contract_release.py finalize \
            --root "$GITHUB_WORKSPACE" \
            --repository "$SOURCE_REPOSITORY" \
            --ref "$SOURCE_REF" \
            --commit "$SOURCE_COMMIT" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --bundle "${bundles[0]}" \
            --output-dir "$PUBLICATION_ROOT"
      - name: Publish durable immutable owner release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ROOT: ${{ runner.temp }}/product-contract-publication
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/product-contract-assets"
          mkdir -p "$asset_dir"
          cp "$PUBLICATION_ROOT/contracts/product/v2/catalog.json" "$asset_dir/product-catalog-v2.json"
          owner_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["ownerId"])' "$PUBLICATION_ROOT/owner-publication-v1.json")"
          cp "$PUBLICATION_ROOT/attestations/owners/${owner_id}.jsonl" "$asset_dir/product-catalog-v2.attestation.jsonl"
          cp "$PUBLICATION_ROOT/owner-publication-v1.json" "$asset_dir/owner-publication-v1.json"
          release_args=("$RELEASE_TAG" "$asset_dir/product-catalog-v2.json" "$asset_dir/product-catalog-v2.attestation.jsonl" "$asset_dir/owner-publication-v1.json" --draft --target "$SOURCE_COMMIT" --title "Product catalog v2 $RELEASE_CHANNEL $SOURCE_COMMIT" --notes "Owner-published Product catalog and detached GitHub artifact attestation for $SOURCE_REPOSITORY@$SOURCE_COMMIT ($SOURCE_REF).")
          if [[ "$RELEASE_CHANNEL" == preview ]]; then release_args+=(--prerelease); fi
          gh release create "${release_args[@]}"
          release_id="$(gh release view "$RELEASE_TAG" --repo "$SOURCE_REPOSITORY" --json databaseId --jq .databaseId)"
          gh api --method PATCH "repos/$SOURCE_REPOSITORY/releases/$release_id" -F draft=false >/dev/null
          immutable="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .immutable)"
          if [[ "$immutable" != true ]]; then
            echo "GitHub did not enforce immutable releases for $SOURCE_REPOSITORY; refusing acceptance" >&2
            exit 2
          fi
          tag_commit="$(gh api "repos/$SOURCE_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          if [[ "$tag_commit" != "$SOURCE_COMMIT" ]]; then
            echo "owner release tag resolves to $tag_commit, expected $SOURCE_COMMIT" >&2
            exit 2
          fi
          verify_dir="$RUNNER_TEMP/product-contract-release-verification"
          mkdir -p "$verify_dir"
          gh release download "$RELEASE_TAG" --repo "$SOURCE_REPOSITORY" --dir "$verify_dir"
          cmp "$asset_dir/product-catalog-v2.json" "$verify_dir/product-catalog-v2.json"
          cmp "$asset_dir/product-catalog-v2.attestation.jsonl" "$verify_dir/product-catalog-v2.attestation.jsonl"
          cmp "$asset_dir/owner-publication-v1.json" "$verify_dir/owner-publication-v1.json"

  product-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/product/src
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.3
      - run: python -m json.tool ../service.json >/dev/null
      - run: python ../scripts/check_silent_exceptions.py
      - run: uv sync --frozen --group dev --extra integrations --no-install-local
      - run: uv run --no-sync ruff check --no-cache src tests
      - run: uv run --no-sync ruff format --check --no-cache src tests
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -p no:cacheprovider -q
      - run: uv run --no-sync openapi-spec-validator ../contracts/product/v1/openapi.yaml

  product-hub-integration:
    name: product / pinned Plugins integration hub
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/product/src
      CYRENE_REQUIRE_PLUGINS_WORKTREE: "1"
      PLUGINS_WORKTREE: ${{ runner.temp }}/Cyrene-Plugins-Official
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.3
      - name: Resolve the exact Plugins source pin from the consumer lock
        id: plugins-pin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          lock = json.loads(Path("contracts-message.lock.json").read_text(encoding="utf-8"))
          revision = lock.get("sourceRevision")
          if (
              lock.get("sourceRepository") != "DoHorizon-AI/Cyrene-Plugins-Official"
              or not isinstance(revision, str)
              or re.fullmatch(r"[0-9a-f]{40}", revision) is None
          ):
              raise SystemExit("Exchange Plugins consumer lock has no immutable source revision")
          print(f"revision={revision}")
          PY
      - name: Fetch the locked Plugins checkout
        run: |
          git init --quiet "$PLUGINS_WORKTREE"
          git -C "$PLUGINS_WORKTREE" remote add origin \
            https://github.com/DoHorizon-AI/Cyrene-Plugins-Official.git
          git -C "$PLUGINS_WORKTREE" fetch --quiet --depth 1 origin \
            "${{ steps.plugins-pin.outputs.revision }}"
          git -C "$PLUGINS_WORKTREE" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$PLUGINS_WORKTREE" rev-parse HEAD)" = \
            "${{ steps.plugins-pin.outputs.revision }}"
      - name: Install the frozen Product integrations environment
        run: uv sync --frozen --group dev --extra integrations --no-install-local
      - name: Install pinned WeCom runtime test dependencies
        run: uv pip install --python .venv/bin/python -r \
          "$PLUGINS_WORKTREE/plugins/connectors/wecom/requirements.lock"
      - name: Run the non-skippable real Plugin and Authority hub flow
        env:
          CYRENE_PLUGINS_WORKTREE: ${{ runner.temp }}/Cyrene-Plugins-Official
        run: uv run --no-sync pytest -p no:cacheprovider -q tests/test_integration_hub_e2e.py
