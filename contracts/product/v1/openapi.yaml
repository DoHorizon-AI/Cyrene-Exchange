  /api/v1/integrations/hooks/wecom/{bindingId}:
    post:
      summary: Admit Wecom Inbound
      operationId: integrationAdmitWeComInbound
      parameters:
      - name: bindingId
        in: path
        required: true
        schema:
          type: string
          title: Bindingid
      - name: X-Cyrene-WeCom-Timestamp
        in: header
        required: true
        description: Unix seconds, no more than 300 seconds old or 30 seconds in the future.
        schema:
          type: string
          pattern: ^(0|[1-9][0-9]{0,12})$
      - name: X-Cyrene-WeCom-Request-Id
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.-]{1,200}$
      - name: X-Cyrene-WeCom-Body-SHA256
        in: header
        required: true
        description: Lowercase SHA-256 of the exact raw JSON request body.
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: X-Cyrene-WeCom-Source-Binding-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Cyrene-WeCom-Signature
        in: header
        required: true
        description: HMAC-SHA256 over v1, POST, exact request path, timestamp, request ID, source binding ID, and
          body SHA-256, joined by LF.
        schema:
          type: string
          pattern: ^sha256=[0-9a-f]{64}$
      responses:
        '202':
          description: The source event and any fixed command/challenge work are durably recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                title: Response Integrationadmitwecominbound
                required:
                - accepted
                - persisted
                - eventId
                properties:
                  accepted:
                    type: boolean
                    const: true
                  persisted:
                    type: boolean
                    const: true
                  eventId:
                    type: string
                    format: uuid
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - schemaVersion
              - bindingId
              - organizationId
              - workspaceId
              - sourceAuthority
              - botNamespace
              - accountId
              - conversationId
              - conversationKind
              - sourceEventId
              - senderId
              - fromSelf
              - sourceTransportRequestId
              - messageProtoB64
              properties:
                schemaVersion:
                  type: integer
                  const: 1
                bindingId:
                  type: string
                  format: uuid
                organizationId:
                  type: string
                  minLength: 1
                  maxLength: 200
                workspaceId:
                  type: string
                  minLength: 1
                  maxLength: 200
                sourceAuthority:
                  type: string
                  minLength: 1
                  maxLength: 300
                botNamespace:
                  type: string
                  minLength: 1
                  maxLength: 300
                accountId:
                  type: string
                  minLength: 1
                  maxLength: 300
                conversationId:
                  type: string
                  minLength: 1
                  maxLength: 292
                conversationKind:
                  type: string
                  enum:
                  - private
                  - group
                sourceEventId:
                  type: string
                  minLength: 1
                  maxLength: 300
                senderId:
                  type: string
                  minLength: 1
                  maxLength: 200
                fromSelf:
                  type: boolean
                sourceTransportRequestId:
                  type: string
                  minLength: 1
                  maxLength: 300
                messageProtoB64:
                  type: string
                  contentEncoding: base64
                  contentMediaType: application/x-protobuf
components:
  securitySchemes:
    WorkspaceControlBearer:
      type: http
      scheme: bearer
    IntegrationBearer:
      type: http
      scheme: bearer
    ProductExecutionCredential:
      type: apiKey
      in: header
      name: x-cyrene-execution-credential-bin
      description: Base64 Platform-approved Product execution credential, verified over the registered Exchange workload
        mTLS channel.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
    EndpointId:
      name: endpointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 control-plane error
      content:
        application/problem+json:
          schema:
            $ref: ./generated/common/problem-details.schema.json
  schemas:
    CreateEndpointRequest:
      type: object
      required:
      - name
      - publicBaseUrl
      - authPolicyRef
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        publicBaseUrl:
          type: string
          format: uri
        authPolicyRef:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
    CreateRouteRequest:
      type: object
      required:
      - endpointId
      - modelPattern
      - targetBindingId
      - priority
      properties:
        endpointId:
          type: string
          format: uuid
        modelPattern:
          type: string
          minLength: 1
          maxLength: 200
        targetBindingId:
          type: string
          minLength: 1
          maxLength: 300
        targetModel:
          type: string
          minLength: 1
          maxLength: 200
        priority:
          type: integer
          minimum: 0
          maximum: 10000
      additionalProperties: false
    FunctionTool:
      type: object
      required:
      - type
      - function
      properties:
        type:
          type: string
          const: function
        function:
          $ref: '#/components/schemas/FunctionDefinition'
      additionalProperties: false
    FunctionDefinition:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        parameters:
          type: object
        strict:
          type: boolean
      additionalProperties: false
    NamedToolChoice:
      type: object
      required:
      - type
      - function
      properties:
        type:
          type: string
          const: function
        function:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              minLength: 1
          additionalProperties: false
      additionalProperties: false
    StreamOptions:
      type: object
      properties:
        include_usage:
          type: boolean
          default: false
      additionalProperties: false
    ConfirmRouteRequest:
      properties:
        resourceVersion:
          type: integer
          minimum: 1.0
          title: Resourceversion
      additionalProperties: false
      type: object
      required:
      - resourceVersion
      title: ConfirmRouteRequest
      description: Explicit confirmation of the exact inspected draft version. | 确认草稿版本。
    CreateRouteDraftRequest:
      properties:
        endpointId:
          type: string
          format: uuid
          title: Endpointid
        modelPattern:
          type: string
          maxLength: 200
          minLength: 1
          title: Modelpattern
        targetBindingId:
          type: string
          maxLength: 300
          minLength: 1
          title: Targetbindingid
        targetModel:
          type: string
          maxLength: 200
          minLength: 1
          title: Targetmodel
        priority:
          type: integer
          maximum: 10000.0
          minimum: 0.0
          title: Priority
        source:
          $ref: '#/components/schemas/RouteSource'
      additionalProperties: false
      type: object
      required:
      - endpointId
      - modelPattern
      - targetBindingId
      - targetModel
      - priority
      - source
      title: CreateRouteDraftRequest
      description: Explicit Send to creates a draft, never an active route. | 发送到只创建草稿。
    CreateWorkspaceRouteDraftRequest:
      type: object
      additionalProperties: false
      required:
      - endpointId
      - modelPattern
      - targetBindingId
      - targetModel
      - priority
      - sourceEndpoint
      properties:
        endpointId:
          type: string
          format: uuid
        modelPattern:
          type: string
          minLength: 1
          maxLength: 200
        targetBindingId:
          type: string
          minLength: 1
          maxLength: 300
        targetModel:
          type: string
          minLength: 1
          maxLength: 200
        priority:
          type: integer
          minimum: 0
          maximum: 10000
        sourceEndpoint:
          type: object
          additionalProperties: false
          required:
          - product
          - endpointId
          - resourceVersion
          properties:
            product:
              type: string
              const: reactor
            endpointId:
              type: string
              format: uuid
            resourceVersion:
              type: integer
              minimum: 1
          description: >-
            Command-only opaque selector. It is resolved by Exchange through
            its operator grant and fixed private Reactor origin; callers cannot
            supply a URL, path, host, or arbitrary operation.
      title: CreateWorkspaceRouteDraftRequest
      description: >-
        Private Workspace command. The Reactor source selector is not a
        navigable ProductResourceReference and contains no network location.
    EditRouteDraftRequest:
      properties:
        resourceVersion:
          type: integer
          minimum: 1.0
          title: Resourceversion
        modelPattern:
          type: string
          maxLength: 200
          minLength: 1
          title: Modelpattern
        targetBindingId:
          type: string
          maxLength: 300
          minLength: 1
          title: Targetbindingid
        targetModel:
          type: string
          maxLength: 200
          minLength: 1
          title: Targetmodel
        priority:
          type: integer
          maximum: 10000.0
          minimum: 0.0
          title: Priority
      additionalProperties: false
      type: object
      required:
      - resourceVersion
      - modelPattern
      - targetBindingId
      - targetModel
      - priority
      title: EditRouteDraftRequest
      description: Editable route intent with optimistic concurrency. | 草稿修改与版本检查。
    ApiKeyState:
      type: string
      enum:
      - ACTIVE
      - REVOKED
      title: ApiKeyState
      description: Gateway API key lifecycle. | 网关 API Key 生命周期。
    CreateApiKeyRequest:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        expiresAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        modelScope:
          items:
            type: string
          maxItems: 100
          type: array
          title: Modelscope
      additionalProperties: false
      type: object
      required:
      - name
      title: CreateApiKeyRequest
      description: Server-generated gateway key request. | 服务端生成网关密钥请求。
    ApiKey:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        credentialRef:
          type: string
          pattern: ^api-key://[0-9a-f-]{36}$
          title: Credentialref
        actorId:
          type: string
          maxLength: 300
          minLength: 1
          title: Actorid
        workspaceId:
          type: string
          maxLength: 300
          minLength: 1
          title: Workspaceid
        state:
          $ref: '#/components/schemas/ApiKeyState'
        modelScope:
          items:
            type: string
          maxItems: 100
          type: array
          title: Modelscope
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
        expiresAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        revokedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        resourceVersion:
          type: integer
          minimum: 1.0
          title: Resourceversion
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - credentialRef
      - actorId
      - workspaceId
      - state
      - createdAt
      - updatedAt
      - resourceVersion
      title: ApiKey
      description: Gateway credential metadata; the secret is never persisted. | 密钥元数据。
    CreatedApiKey:
      allOf:
      - $ref: '#/components/schemas/ApiKey'
      - properties:
          secret:
            anyOf:
            - type: string
            - type: 'null'
            title: Secret
        type: object
        title: CreatedApiKey
      description: Creation response carrying the one-time secret. | 仅创建响应携带一次性密钥。
    EndpointState:
      type: string
      enum:
      - ACTIVE
      - DISABLED
      title: EndpointState
      description: External GatewayEndpoint lifecycle. | 外部网关端点生命周期。
    GatewayEndpoint:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        state:
          $ref: '#/components/schemas/EndpointState'
          default: ACTIVE
        publicBaseUrl:
          type: string
          pattern: ^https?://
          title: Publicbaseurl
        authPolicyRef:
          type: string
          maxLength: 500
          pattern: ^(policy|secret)://
          title: Authpolicyref
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
        resourceVersion:
          type: integer
          minimum: 1.0
          title: Resourceversion
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - publicBaseUrl
      - authPolicyRef
      - createdAt
      - updatedAt
      - resourceVersion
      title: GatewayEndpoint
      description: Externally published model API surface. | 对外发布的模型 API 表面。
    GatewayRoute:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        endpointId:
          type: string
          format: uuid
          title: Endpointid
        state:
          $ref: '#/components/schemas/RouteState'
          default: ACTIVE
        modelPattern:
          type: string
          maxLength: 200
          minLength: 1
          title: Modelpattern
        targetBindingId:
          type: string
          maxLength: 300
          minLength: 1
          title: Targetbindingid
        targetCapabilityType:
          type: string
          const: model.provider.v1
          title: Targetcapabilitytype
          default: model.provider.v1
        targetModel:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Targetmodel
        priority:
          type: integer
          maximum: 10000.0
          minimum: 0.0
          title: Priority
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
        resourceVersion:
          type: integer
          minimum: 1.0
          title: Resourceversion
        source:
          anyOf:
          - $ref: '#/components/schemas/RouteSource'
          - type: 'null'
        createdBy:
          anyOf:
          - type: string
          - type: 'null'
          title: Createdby
        workspaceId:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspaceid
      additionalProperties: false
      type: object
      required:
      - id
      - endpointId
      - modelPattern
      - targetBindingId
      - priority
      - createdAt
      - updatedAt
      - resourceVersion
      title: GatewayRoute
      description: Product route to an opaque provider capability binding. | 指向不透明能力绑定的路由。
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RouteSource:
      properties:
        product:
          type: string
          const: reactor
          title: Product
          default: reactor
        resourceUri:
          type: string
          maxLength: 2000
          pattern: ^https?://
          title: Resourceuri
        resourceVersion:
          type: integer
          minimum: 1.0
          title: Resourceversion
        artifactDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          title: Artifactdigest
        modelVersionId:
          anyOf:
          - type: string
            pattern: ^model-version://sha256/[0-9a-f]{64}$
          - type: 'null'
          default: null
          title: Modelversionid
      additionalProperties: false
      type: object
      required:
      - resourceUri
      - resourceVersion
      - artifactDigest
      title: RouteSource
      description: Versioned reference to an existing Reactor Endpoint. | 来源端点引用。
    RouteState:
      type: string
      enum:
      - ACTIVE
      - DISABLED
      - DRAFT
      title: RouteState
      description: Persisted GatewayRoute lifecycle. | 持久化网关路由生命周期。
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AttachActorBindingBody:
      properties:
        accountLinkRef:
          type: string
          maxLength: 300
          minLength: 1
          title: Accountlinkref
        delegationRef:
          type: string
          maxLength: 300
          minLength: 1
          title: Delegationref
      additionalProperties: false
      type: object
      required:
      - accountLinkRef
      - delegationRef
      title: AttachActorBindingBody
      description: Attach only the authenticated member's external account and grant refs.
    BeginLinkBody:
      properties:
        provider:
          type: string
          pattern: ^(github|wecom)$
          title: Provider
      additionalProperties: false
      type: object
      required:
      - provider
      title: BeginLinkBody
      description: Fixed external account provider selector.
    CommentBody:
      properties:
        issueNumber:
          type: integer
          minimum: 1.0
          title: Issuenumber
        body:
          type: string
          maxLength: 4000
          minLength: 1
          title: Body
      additionalProperties: false
      type: object
      required:
      - issueNumber
      - body
      title: CommentBody
      description: One bounded GitHub issue comment.
    ConfirmWeComBody:
      properties:
        linkSessionRef:
          type: string
          format: uuid
          title: Linksessionref
        challengeId:
          type: string
          format: uuid
          title: Challengeid
        challengeValue:
          type: string
          maxLength: 128
          minLength: 16
          title: Challengevalue
      additionalProperties: false
      type: object
      required:
      - linkSessionRef
      - challengeId
      - challengeValue
      title: ConfirmWeComBody
      description: Challenge confirmation tied to an Account Center link session.
    ConnectionHealthResponse:
      properties:
        status:
          type: string
          enum:
          - SERVING
          - NOT_SERVING
          - UNKNOWN
          title: Status
        observedAt:
          type: string
          format: date-time
          title: Observedat
        pluginId:
          anyOf:
          - type: string
          - type: 'null'
          title: Pluginid
        pluginVersion:
          anyOf:
          - type: string
          - type: 'null'
          title: Pluginversion
        capabilities:
          items:
            type: string
          type: array
          title: Capabilities
        errorCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Errorcode
      additionalProperties: false
      type: object
      required:
      - status
      - observedAt
      - capabilities
      title: ConnectionHealthResponse
      description: Read-only DirectPluginRuntime Health observation for a fixed connection.
    CreateBindingBody:
      properties:
        connectionId:
          type: string
          format: uuid
          title: Connectionid
        notificationTargetRef:
          type: string
          maxLength: 300
          minLength: 1
          title: Notificationtargetref
      additionalProperties: false
      type: object
      required:
      - connectionId
      - notificationTargetRef
      title: CreateBindingBody
      description: Create a group notification rule without attaching member credentials.
    CreateConnectionBody:
      properties:
        provider:
          type: string
          enum:
          - github
          - wecom
          - azure
          - gcp
          - hf
          - runpod
          - tailscale
          default: github
          title: Provider
        bindingRef:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 300
          - type: 'null'
          default: null
          title: Bindingref
        targetRef:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 300
          - type: 'null'
          default: null
          title: Targetref
        accountLinkRef:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 300
          - type: 'null'
          default: null
          title: Accountlinkref
        repositoryId:
          type: string
          maxLength: 200
          title: Repositoryid
        repositoryName:
          type: string
          maxLength: 300
          title: Repositoryname
      additionalProperties: false
      type: object
      title: CreateConnectionBody
      description: Create one provider connection with configured opaque aliases only.
    IntegrationConnectionResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        provider:
          type: string
          enum:
          - github
          - wecom
          - azure
          - gcp
          - hf
          - runpod
          - tailscale
          title: Provider
        displayName:
          type: string
          title: Displayname
        repositoryId:
          anyOf:
          - type: string
          - type: 'null'
          title: Repositoryid
        repositoryName:
          anyOf:
          - type: string
          - type: 'null'
          title: Repositoryname
        enabled:
          type: boolean
          title: Enabled
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
      additionalProperties: false
      type: object
      required:
      - id
      - provider
      - displayName
      - repositoryId
      - repositoryName
      - enabled
      - createdAt
      - updatedAt
      title: IntegrationConnectionResponse
      description: Actor-scoped safe connection projection without tenant or actor identity.
    AuthorizationCapabilityResponse:
      type: object
      additionalProperties: false
      required:
      - capabilityId
      - state
      - lastVerifiedAt
      - expiresAt
      - reasonCode
      properties:
        capabilityId:
          type: string
        state:
          type: string
          enum:
          - VALID
          - REAUTHORIZATION_REQUIRED
          - PERMISSION_DENIED
          - UNKNOWN
          - UNAVAILABLE
        lastVerifiedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        expiresAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        reasonCode:
          anyOf:
          - type: string
          - type: 'null'
    AuthorizationHealthResponse:
      type: object
      additionalProperties: false
      required:
      - connectionId
      - provider
      - authorizationRef
      - loginState
      - authorizationState
      - checkedAt
      - expiresAt
      - generation
      - capabilities
      - reasonCode
      properties:
        connectionId:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - github
          - wecom
          - azure
          - gcp
          - hf
          - runpod
          - tailscale
        authorizationRef:
          anyOf:
          - type: string
          - type: 'null'
        loginState:
          type: string
          enum:
          - PRESENT
          - MISSING
          - UNKNOWN
          - UNAVAILABLE
        authorizationState:
          type: string
          enum:
          - VALID
          - REAUTHORIZATION_REQUIRED
          - PERMISSION_DENIED
          - UNKNOWN
          - UNAVAILABLE
        checkedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        expiresAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        generation:
          type: integer
          minimum: 0
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationCapabilityResponse'
        reasonCode:
          anyOf:
          - type: string
          - type: 'null'
      description: Latest provider fact; absence and uncertainty are never projected as valid.
    RenewalSessionResponse:
      type: object
      additionalProperties: false
      required:
      - sessionRef
      - authorizationRef
      - state
      - createdAt
      - expiresAt
      - authorizationUrl
      - userCode
      - qrAttachmentRef
      - generation
      - reasonCode
      properties:
        sessionRef:
          type: string
        authorizationRef:
          type: string
        state:
          type: string
          enum:
          - WAITING_USER
          - VERIFYING
          - SUCCEEDED
          - FAILED
          - EXPIRED
          - CANCELLED
        createdAt:
          type: string
          format: date-time
        expiresAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        authorizationUrl:
          anyOf:
          - type: string
          - type: 'null'
          description: >-
            Verified WeCom navigation URI or one of the exact Hugging Face
            device-code URLs, https://hf.co/oauth/device and
            https://huggingface.co/oauth/device. This generic field does not
            imply that every URI is a QR flow.
        userCode:
          anyOf:
          - type: string
            minLength: 4
            maxLength: 32
            pattern: ^[A-Z0-9]{4}-[A-Z0-9]{4}$
          - type: 'null'
          description: Short-lived user-entered code for Hugging Face device OAuth only.
        qrAttachmentRef:
          anyOf:
          - type: string
          - type: 'null'
        generation:
          type: integer
          minimum: 0
        reasonCode:
          anyOf:
          - type: string
          - type: 'null'
      description: Product renewal session with opaque references and a verified provider navigation URI only.
    CloudResourceResponse:
      type: object
      additionalProperties: false
      required:
      - externalRef
      - kind
      - displayName
      - status
      - providerStatus
      - collectedAt
      - observedAt
      - source
      - freshness
      - attributes
      - platformResourceRef
      - platformGeneration
      properties:
        externalRef:
          type: string
        kind:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum:
          - RUNNING
          - STOPPED
          - AVAILABLE
          - UNAVAILABLE
          - DEGRADED
          - UNKNOWN
        providerStatus:
          anyOf:
          - type: string
          - type: 'null'
        collectedAt:
          type: string
          format: date-time
        observedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        source:
          type: string
        freshness:
          type: string
          enum:
          - FRESH
          - STALE
          - UNKNOWN
        attributes:
          type: object
          additionalProperties:
            anyOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
            - type: 'null'
        platformResourceRef:
          anyOf:
          - type: string
          - type: 'null'
        platformGeneration:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
    ConnectionResourcesResponse:
      type: object
      additionalProperties: false
      required:
      - connectionId
      - provider
      - checkedAt
      - resources
      properties:
        connectionId:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - github
          - wecom
          - azure
          - gcp
          - hf
          - runpod
          - tailscale
        checkedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/CloudResourceResponse'
    NotificationResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - sequence
      - connectionId
      - kind
      - severity
      - title
      - description
      - createdAt
      - actionRef
      - acknowledgedAt
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        connectionId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        kind:
          type: string
          enum:
          - authorization.expiring
          - authorization.required
          - connection.unavailable
          - cloud.resource.changed
          - delivery.failed
        severity:
          type: string
          enum:
          - INFO
          - WARNING
          - ERROR
        title:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        actionRef:
          anyOf:
          - type: string
          - type: 'null'
        acknowledgedAt:
