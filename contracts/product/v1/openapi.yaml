openapi: 3.1.2
x-cyrene-contract-profile: product-http-v1
info:
  title: Cyrene Exchange Product API
  version: 1.0.0
  license:
    name: Apache-2.0
paths:
  /api/v1/gateway-endpoints:
    post:
      operationId: createGatewayEndpoint
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpointRequest'
      responses:
        '201':
          description: GatewayEndpoint created or replayed
          content:
            application/json:
              schema:
                $ref: ./gateway-endpoint.schema.json
        '409':
          $ref: '#/components/responses/Problem'
    get:
      operationId: listGatewayEndpoints
      responses:
        '200':
          description: Persisted GatewayEndpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./gateway-endpoint.schema.json
  /api/v1/gateway-endpoints/{endpointId}:
    get:
      operationId: getGatewayEndpoint
      parameters:
      - $ref: '#/components/parameters/EndpointId'
      responses:
        '200':
          description: GatewayEndpoint
          content:
            application/json:
              schema:
                $ref: ./gateway-endpoint.schema.json
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/gateway-endpoints/{endpointId}/actions/disable:
    post:
      operationId: disableGatewayEndpoint
      parameters:
      - $ref: '#/components/parameters/EndpointId'
      responses:
        '200':
          description: Disabled GatewayEndpoint
          content:
            application/json:
              schema:
                $ref: ./gateway-endpoint.schema.json
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/gateway-routes:
    post:
      operationId: createGatewayRoute
      description: Legacy organization-unscoped write. Organization-bound credentials must use scoped Workspace routes.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteRequest'
      responses:
        '201':
          description: GatewayRoute created or replayed
          content:
            application/json:
              schema:
                $ref: ./gateway-route.schema.json
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    get:
      operationId: listGatewayRoutes
      description: Lists only rows whose organization attribution is unknown.
      responses:
        '200':
          description: Legacy GatewayRoutes without organization attribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./gateway-route.schema.json
  /api/v1/gateway-routes/{routeId}:
    get:
      operationId: getGatewayRoute
      parameters:
      - name: routeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Legacy GatewayRoute without organization attribution
          content:
            application/json:
              schema:
                $ref: ./gateway-route.schema.json
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspace/gateway-routes:
    get:
      operationId: listWorkspaceGatewayRoutes
      security:
      - WorkspaceControlBearer: []
      responses:
        '200':
          description: Workspace-scoped GatewayRoutes with non-navigable source provenance and no internal Reactor URL
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./workspace-gateway-route.schema.json
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/workspace/gateway-route-drafts:
    post:
      operationId: createWorkspaceGatewayRouteDraft
      security:
      - WorkspaceControlBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRouteDraftRequest'
      responses:
        '201':
          description: DRAFT created for the authenticated organization and workspace; the command selector is resolved server-side and the response omits the internal Reactor URL
          content:
            application/json:
              schema:
                $ref: ./workspace-gateway-route.schema.json
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/api-keys:
    post:
      operationId: createApiKey
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key metadata; the secret is present only when created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiKey'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    get:
      operationId: listApiKeys
      responses:
        '200':
          description: API key metadata without secret material
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/api-keys/{apiKeyId}:
    get:
      operationId: getApiKey
      parameters:
      - name: apiKeyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: API key metadata without secret material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/api-keys/{apiKeyId}/actions/revoke:
    post:
      operationId: revokeApiKey
      parameters:
      - name: apiKeyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Revoked API key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      description: Existing OpenAI-compatible Exchange data plane
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - model
              - messages
              properties:
                model:
                  type: string
                  minLength: 1
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                stream:
                  type: boolean
                  default: false
                tools:
                  type: array
                  items:
                    $ref: '#/components/schemas/FunctionTool'
                tool_choice:
                  oneOf:
                  - type: string
                    enum:
                    - none
                    - auto
                    - required
                  - $ref: '#/components/schemas/NamedToolChoice'
                parallel_tool_calls:
                  type: boolean
                stream_options:
                  $ref: '#/components/schemas/StreamOptions'
              additionalProperties: true
      responses:
        '200':
          description: OpenAI-compatible completion or SSE stream
        '401':
          description: OpenAI-compatible authentication error
        '429':
          description: Product tenant quota exhausted
        '503':
          description: No eligible persisted route or quota usage source unavailable
  /api/v1/gateway-route-drafts:
    post:
      summary: Create Draft
      operationId: create_draft_api_v1_gateway_route_drafts_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteDraftRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayRoute'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/gateway-route-drafts/{routeId}:
    patch:
      summary: Edit Draft
      operationId: edit_draft_api_v1_gateway_route_drafts__routeId__patch
      parameters:
      - name: routeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Routeid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRouteDraftRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayRoute'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/gateway-route-drafts/{routeId}/actions/confirm:
    post:
      summary: Confirm Draft
      operationId: confirm_draft_api_v1_gateway_route_drafts__routeId__actions_confirm_post
      parameters:
      - name: routeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Routeid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRouteRequest'
      responses:
        '200':
